name: Android APK Build and Emulator Smoke Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build APK and test on Android 14 emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Android 14 emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.dskushwahagroup.app 1
            sleep 15
            adb shell pidof com.dskushwahagroup.app
            adb logcat -d -t 2500 | grep -E "FATAL EXCEPTION|Process: com.dskushwahagroup.app" && exit 1 || true
            test -n "$(adb shell pidof com.dskushwahagroup.app)"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DS-KUSHWAHA-GROUP-APP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
